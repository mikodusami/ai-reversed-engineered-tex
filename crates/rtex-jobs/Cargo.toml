[package]
name = "rtex-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Job postings in, tailored resumes out: the engine behind RTeX's Jobs window"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
regex = "1.13.1"
rtex-core = { path = "../rtex-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
